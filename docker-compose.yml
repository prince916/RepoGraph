# Local development Postgres. Matches the DATABASE_URL example in README.md:
#   postgres://user:pass@localhost:5432/repograph
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: repograph
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d repograph']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
